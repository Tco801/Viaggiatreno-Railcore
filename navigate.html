<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Percorsi - ViaggiaTreno RailCore</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

        alt="RailCore">

    <div class="header-text">

    </div>

</header>

<nav class="navbar">

    <a href="index.html">
        🏠 Home
    </a>

    <a href="navigate.html">
        🔍 Percorsi
    </a>

</nav>

<div class="status-bar">

        🟢 Server Online
    </span>

        🔍 Ricerca Percorsi
    </span>

</div>

<main class="container">

    <div class="card">

        <h2>Cerca Percorso</h2>

        <input

            type="text"
            placeholder="Stazione di arrivo">

        <br><br>

        <button id="searchBtn">

    </div>

    <div id="results">

        src="navigate.js">
