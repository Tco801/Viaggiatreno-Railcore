
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percorsi - ViaggiaTreno RailCore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="main-header">
    <img src="https://cdn.modrinth.com/data/I8nHY8ll/4232f6ec6bc0516f23e2828a61a78998c49b5f3d.png" class="logo" alt="RailCore">
    <div class="header-text">
        <h1>ViaggiaTreno RailCore</h1>
        <p>Ricerca Percorsi</p>
    </div>
</header>

<nav class="navbar">
    <a href="index.html">🏠 Home</a>
    <a href="navigate.html" class="active">🔍 Percorsi</a>
</nav>

<div class="status-bar">
    <span id="serverStatus">🟢 Server Online</span>
    <span id="mcTime">🕒 Ora Minecraft: --:--</span>
</div>

<main class="container">
    <section class="card search-card">
        <h2>Cerca Soluzioni di Viaggio</h2>
        
        <form id="searchForm" class="search-form">
            <div class="input-group">
                <label for="fromStation">Partenza</label>
                <input 
                    id="fromStation" 
                    type="text" 
                    placeholder="Es. Roma Termini" 
                    list="stationsList" 
                    autocomplete="off" 
                    required
                >
            </div>

            <button type="button" id="swapBtn" class="btn-swap" title="Inverti stazioni">⇄</button>

            <div class="input-group">
                <label for="toStation">Arrivo</label>
                <input 
                    id="toStation" 
                    type="text" 
                    placeholder="Es. Milano Centrale" 
                    list="stationsList" 
                    autocomplete="off" 
                    required
                >
            </div>

            <!-- Suggerimenti dinamici per le stazioni -->
            <datalist id="stationsList"></datalist>

            <button type="submit" id="searchBtn" class="btn-primary">
                Cerca Percorso
            </button>
        </form>
    </section>

    <!-- Contenitore Risultati -->
    <section id="results" class="results-container"></section>
</main>

<script type="module" src="navigate.js"></script>
</body>
</html>
