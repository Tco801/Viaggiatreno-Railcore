<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettaglio Treno</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="main-header">
    <img
        src="https://cdn.modrinth.com/data/I8nHY8ll/4232f6ec6bc0516f23e2828a61a78998c49b5f3d.png"
        class="logo railcore-logo"
        alt="RailCore"
    >
    <div class="header-text">
        <h1>ViaggiaTreno RailCore</h1>
        <p>Monitoraggio ferroviario in tempo reale</p>
    </div>
</header>

<nav class="navbar">
    <a href="index.html">🏠 Home</a>
    <a href="navigate.html">🔍 Percorsi</a>
</nav>

<div class="status-bar">
    <span id="serverStatus">🟢 Server Online</span>
    <span id="mcTime">🕒 Ora Minecraft: --:--</span>
</div>

<main class="container">

    <!-- HEADER TRENO -->
    <section class="card train-header-card">
        <div id="trainName">Caricamento...</div>
    </section>

    <!-- INFO TRENO (Tutto dentro un unico riquadro .card) -->
    <section class="card">
        <div id="trainInfo" class="stats-grid"></div>
    </section>

    <!-- PERCORSO -->
    <section class="card">
        <div class="section-header">
            <h3>🚆 Percorso del treno</h3>
        </div>
        <table class="stop-list">
            <thead>
                <tr>
                    <th>Stazione</th>
                    <th>Bin.</th>
                    <th>Arrivo</th>
                    <th>Partenza</th>
                </tr>
            </thead>
            <tbody id="stops"></tbody>
        </table>
    </section>

</main>

<script type="module" src="train.js"></script>

</body>

</html>
