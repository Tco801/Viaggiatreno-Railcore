<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dettaglio Treno</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header class="main-header">

    <img
        src="https://cdn.modrinth.com/data/I8nHY8ll/4232f6ec6bc0516f23e2828a61a78998c49b5f3d.png"
        class="logo"
        alt="RailCore">

    <div class="header-text">

        <h1>ViaggiaTreno RailCore</h1>

        <p>
            Monitoraggio ferroviario in tempo reale
        </p>

    </div>

</header>

<nav class="navbar">

    <a href="index.html">
        🏠 Home
    </a>

    <a href="navigate.html">
        🔍 Percorsi
    </a>

</nav>

<div class="status-bar">

    <span id="serverStatus">
        🟢 Server Online
    </span>

    <span id="mcTime">
        🕒 Ora Minecraft: --:--
    </span>

</div>

<main class="container">

    <div class="card">

        <h2 id="trainName">
            Caricamento...
        </h2>

    </div>

    <div
        id="trainInfo"
        class="train-info">

    </div>

    <div class="card">

        <h3>Percorso del treno</h3>

        <br>

        <table class="stop-list">

            <thead>

                <tr>

                    <th>Stazione</th>
                    <th>Bin.</th>
                    <th>Arrivo</th>
                    <th>Partenza</th>

                </tr>

            </thead>

            <tbody id="stops">

            </tbody>

        </table>

    </div>

</main>

<script type="module"
        src="train.js">
</script>

</body>

</html>
