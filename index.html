<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ViaggiaTreno RailCore</title>

    <link
        rel="stylesheet"
        href="style.css">
</head>

<body>

    <header class="main-header">

        <img
            src="https://cdn.modrinth.com/data/I8nHY8ll/4232f6ec6bc0516f23e2828a61a78998c49b5f3d.png"
            class="logo railcore-logo"
            alt="RailCore">

        <div class="header-text">

            <h1>ViaggiaTreno RailCore</h1>

            <p>
                Monitoraggio ferroviario in tempo reale
            </p>

        </div>

    </header>

    <nav class="navbar">

        <a href="index.html">
            🏠 Home
        </a>

        <a href="navigate.html">
            🔍 Percorsi
        </a>

        <a href="railcore.html">
            🚄 RailCore
        </a>

    </nav>

    <div class="status-bar">

        <span id="serverStatus">

            🟢 Server Online

        </span>

        <span id="mcTime">

            🕒 Ora Minecraft: --:--

        </span>

    </div>

    <main class="container">

        <section
            id="dashboardStats"
            class="stats-grid">

        </section>

        <section class="card">

            <div class="section-header">

                <h2>
                    🚉 Stazioni disponibili
                </h2>

                <p>
                    Seleziona una stazione per visualizzare il tabellone.
                </p>

            </div>

            <div
                id="stationList"
                class="station-grid">

            </div>

        </section>

        <section class="card">

            <div class="section-header">

                <h2>
                    🚆 Treni in servizio
                </h2>

                <p>
                    Servizi ferroviari attualmente rilevati.
                </p>

            </div>

            <div
                id="nextDepartures"
                class="departures-grid">

            </div>

        </section>

    </main>

    <script
        type="module"
        src="home.js">
    </script>

</body>

</html>
